name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Đồng bộ Google Sheet
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_RANGE: ${{ secrets.SHEET_RANGE }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          REQUIRE_AUTH: ${{ vars.REQUIRE_AUTH }}
          VITE_REQUIRE_AUTH: ${{ vars.REQUIRE_AUTH }}
        run: node scripts/fetch-and-encrypt.mjs
      - name: Build
        env:
          VITE_REQUIRE_AUTH: ${{ vars.REQUIRE_AUTH }}
          VITE_BASE: ${{ vars.VITE_BASE }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
